<title>Registro Mensile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a month sheet — names down a sticky left column, days 1–31 across; one control bar on top. */
:root {
  --bg: #eef2f5;
  --surface: #ffffff;
  --ink: #17222b;
  --muted: #5d6b77;
  --line: #d5dde3;
  --accent: #1f6f9f;
  --accent-ink: #ffffff;
  --today: #e3eff7;
  --cold: #2a5d88;
  --warm: #2c7a57;
  --off: #e6eaed;
  --danger: #b4372c;
  --shadow: 0 10px 30px rgba(20, 40, 60, .16);
  --f-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1418; --surface: #151d23; --ink: #e2e9ee; --muted: #8b9aa6; --line: #27333c;
    --accent: #5aaedf; --accent-ink: #08131a; --today: #18303f; --cold: #8cc3ea; --warm: #7fcfa5;
    --off: #11181d; --danger: #f07a6e; --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1418; --surface: #151d23; --ink: #e2e9ee; --muted: #8b9aa6; --line: #27333c;
  --accent: #5aaedf; --accent-ink: #08131a; --today: #18303f; --cold: #8cc3ea; --warm: #7fcfa5;
  --off: #11181d; --danger: #f07a6e; --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, [contenteditable]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}

/* Top bar */
.bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.bar h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: .02em; margin: 0; flex: 1; min-width: 0; text-wrap: balance; }
.bar h1 small { display: block; font-weight: 500; font-size: .78rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.month { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
.month b { min-width: 9.5em; text-align: center; font-weight: 600; font-size: .95rem; }
.icon-btn { background: none; border: 0; width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; font-size: 1.15rem; color: var(--muted); }
.icon-btn:hover { background: var(--bg); color: var(--ink); }
.menu-wrap { position: relative; }
.dots { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.dots svg { width: 18px; height: 18px; fill: var(--ink); }
.menu { position: absolute; right: 0; top: 46px; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 190px; padding: 6px; }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 7px; }
.menu button:hover { background: var(--bg); }
.menu svg { width: 17px; height: 17px; fill: none; stroke: var(--muted); stroke-width: 1.8; }

@media (max-width: 560px) {
  .bar { flex-wrap: wrap; }
  .bar h1 { flex-basis: calc(100% - 56px); order: 1; }
  .menu-wrap { order: 2; }
  .month { order: 3; flex: 1; justify-content: space-between; }
}

/* Sheet */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; }
tr:last-child > * { border-bottom: 0; }
thead th { font-family: var(--f-num); font-weight: 500; font-size: .78rem; color: var(--muted); height: 34px; background: var(--surface); }
thead th.day { min-width: 3.9em; }
thead th.corner { text-align: left; padding: 0 12px; font-family: var(--f-ui); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }
.sticky { position: sticky; left: 0; z-index: 2; background: var(--surface); border-right: 2px solid var(--line); }
th.name { text-align: left; font-weight: 500; vertical-align: middle; }
.name-in {
  width: max-content; max-width: 11.5em; min-width: max(min-content, 6.5em);
  padding: 9px 12px; line-height: 1.25; overflow-wrap: normal; word-break: normal; hyphens: none;
  outline: none; border-radius: 4px;
}
.name-in:empty::before { content: attr(data-ph); color: var(--muted); opacity: .6; }
.name-in:focus { background: var(--today); }
td.cell input {
  width: 4.3em; border: 0; background: transparent; text-align: center; padding: 10px 2px;
  font-family: var(--f-num); font-size: .84rem; color: var(--cold); border-radius: 0;
}
tr.b td.cell input { color: var(--warm); }
td.cell input:focus { background: var(--today); outline: 2px solid var(--accent); outline-offset: -2px; }
td.off { background: repeating-linear-gradient(135deg, var(--off) 0 4px, transparent 4px 8px); }
td.off input { visibility: hidden; }
.is-today { background: var(--today); }
thead th.is-today { color: var(--accent); font-weight: 600; }
tr.b th.name .name-in::after { content: "fascia 2"; display: block; font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; color: var(--warm); margin-top: 2px; }
tr.b th.name .name-in:empty::after { display: none; }

.under { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.ghost { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 8px 14px; font-weight: 500; }
.ghost:hover { border-color: var(--accent); color: var(--accent); }
.legend { margin-left: auto; color: var(--muted); font-size: .8rem; display: flex; gap: 14px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.status { color: var(--muted); font-size: .78rem; margin-top: 10px; }

/* Overlays */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(8, 16, 22, .45); display: grid; place-items: center; padding: 16px; }
.panel { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); width: min(420px, 100%); padding: 22px; max-height: calc(100% - 20px); overflow-y: auto; }
.panel h2 { margin: 0 0 4px; font-size: 1.15rem; text-wrap: balance; }
.panel p.sub { margin: 0 0 18px; color: var(--muted); font-size: .9rem; }
.pin-dots { display: flex; justify-content: center; gap: 14px; margin: 8px 0 6px; }
.pin-dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); }
.pin-dots span.on { background: var(--ink); border-color: var(--ink); }
.pin-err { text-align: center; color: var(--danger); font-size: .85rem; min-height: 1.3em; margin-bottom: 8px; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.keypad button { height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-family: var(--f-num); font-size: 1.3rem; }
.keypad button:active { background: var(--today); }
.keypad .blank { visibility: hidden; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
.row-x { display: flex; justify-content: flex-end; margin-top: 14px; }
.link { background: none; border: 0; color: var(--muted); padding: 8px 4px; }

.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field > span { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select, .num { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.num { width: 6em; font-family: var(--f-num); text-align: center; }
.check { display: flex; gap: 10px; align-items: center; font-size: .92rem; margin-bottom: 16px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.summary { background: var(--bg); border-radius: 10px; padding: 12px 14px; font-size: .9rem; color: var(--muted); margin-bottom: 16px; line-height: 1.45; }
.summary b { color: var(--ink); font-weight: 600; }
.go { width: 100%; height: 54px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-size: 1.1rem; font-weight: 700; letter-spacing: .02em; }
.go:disabled { opacity: .45; cursor: not-allowed; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 10px; font-size: .9rem; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
</style>

<header class="bar">
  <h1>Registro Mensile<small id="sheetLabel">Foglio del mese</small></h1>
  <div class="month">
    <button class="icon-btn" id="prevM" aria-label="Mese precedente">&#8249;</button>
    <b id="monthName"></b>
    <button class="icon-btn" id="nextM" aria-label="Mese successivo">&#8250;</button>
  </div>
  <div class="menu-wrap">
    <button class="dots" id="dotsBtn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
    <div class="menu" id="menu" hidden>
      <button id="openSettings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Impostazioni</button>
      <button id="goToday"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Vai al mese corrente</button>
    </div>
  </div>
</header>

<div class="sheet" id="sheet"><table id="grid"></table></div>

<div class="under">
  <button class="ghost" id="addRow">+ Aggiungi voce</button>
  <button class="ghost" id="delRow">− Togli ultima voce</button>
  <div class="legend">
    <span><i style="background:var(--cold)"></i>Voci normali</span>
    <span><i style="background:var(--warm)"></i>Ultime due voci (fascia 2)</span>
  </div>
</div>
<p class="status" id="status">Caricamento…</p>

<!-- PIN -->
<div class="scrim" id="pinScrim" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pinTitle">
    <h2 id="pinTitle">Impostazioni</h2>
    <p class="sub">Inserisci il PIN per continuare.</p>
    <div class="pin-dots" id="pinDots"><span></span><span></span><span></span><span></span></div>
    <div class="pin-err" id="pinErr"></div>
    <div class="keypad" id="keypad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button class="blank" tabindex="-1" aria-hidden="true"></button><button>0</button><button data-k="del" aria-label="Cancella">&#9003;</button>
    </div>
    <div class="row-x"><button class="link" id="pinCancel">Annulla</button></div>
  </div>
</div>

<!-- Settings -->
<div class="scrim" id="setScrim" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <h2 id="setTitle">Generazione valori</h2>
    <p class="sub">Riempie i fogli dal mese di inizio fino a oggi.</p>
    <label class="field"><span>Mese di inizio</span>
      <div class="inline"><select id="startMonth"></select><select id="startYear"></select></div>
    </label>
    <div class="field"><span>Voci normali</span>
      <div class="inline">da <input class="num" id="aMin" inputmode="decimal"> a <input class="num" id="aMax" inputmode="decimal"></div>
    </div>
    <div class="field"><span>Ultime due voci</span>
      <div class="inline">da <input class="num" id="bMin" inputmode="decimal"> a <input class="num" id="bMax" inputmode="decimal"></div>
    </div>
    <label class="check"><input type="checkbox" id="overwrite"> Sovrascrivi anche le caselle già compilate</label>
    <div class="summary" id="summary"></div>
    <button class="go" id="goBtn">Vai pure</button>
    <div class="row-x"><button class="link" id="setClose">Chiudi</button></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const PIN = "8872";
  const MESI = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
  const LS = "registro-mensile-v1";
  const $ = id => document.getElementById(id);

  const now = new Date();
  const curKey = mk(now.getFullYear(), now.getMonth());
  const uid = () => Math.random().toString(36).slice(2, 10);

  function mk(y, m) { return y + "-" + String(m + 1).padStart(2, "0"); }
  function parseKey(k) { const [y, m] = k.split("-").map(Number); return { y, m: m - 1 }; }
  function shift(k, d) { const { y, m } = parseKey(k); const t = new Date(y, m + d, 1); return mk(t.getFullYear(), t.getMonth()); }
  function daysIn(k) { const { y, m } = parseKey(k); return new Date(y, m + 1, 0).getDate(); }
  function label(k) { const { y, m } = parseKey(k); return MESI[m] + " " + y; }
  function fmt(v) { return v == null ? "" : v.toFixed(1).replace(".", ","); }
  function num(s) {
    const t = String(s).trim().replace(",", ".").replace("−", "-");
    if (t === "" || t === "-") return null;
    const n = Number(t);
    return Number.isFinite(n) ? Math.round(n * 10) / 10 : undefined;
  }

  function defaults() {
    return {
      rows: Array.from({ length: 10 }, () => ({ id: uid(), name: "" })),
      startMonth: shift(curKey, -6),
      ranges: { a: [-21.2, -18.3], b: [3.3, 3.6] },
      overwrite: false
    };
  }

  // ---- state & storage ----
  let config = defaults();
  let months = {};          // "YYYY-MM" -> { cells: { rowId: { day: number } } }
  let viewKey = curKey;
  let db = null;

  function loadLocal() {
    try {
      const raw = localStorage.getItem(LS);
      if (raw) { const s = JSON.parse(raw); if (s.config) config = s.config; if (s.months) months = s.months; }
    } catch (e) {}
  }
  function saveLocal() {
    try { localStorage.setItem(LS, JSON.stringify({ config, months })); } catch (e) {}
  }

  const chains = {};
  function writeDoc(path, data) {
    saveLocal();
    if (!db) return Promise.resolve();
    const body = JSON.parse(JSON.stringify(data));
    chains[path] = (chains[path] || Promise.resolve())
      .then(() => db.doc(path).set(body))
      .catch(err => {
        if (err && err.code === "invalid_argument") toast("Non hai i permessi per salvare le modifiche.");
        else if (err && err.code === "quota_exceeded") toast("Spazio di salvataggio esaurito.");
        else toast("Salvataggio non riuscito, riprova.");
      });
    return chains[path];
  }
  const timers = {};
  function later(key, fn, ms = 600) { clearTimeout(timers[key]); timers[key] = setTimeout(() => { delete timers[key]; fn(); }, ms); }
  const saveConfig = () => later("config", () => writeDoc("registro/config", config));
  const saveMonth = k => later("m" + k, () => writeDoc("mesi/" + k, months[k] || { cells: {} }));

  // ---- rendering ----
  function namedRows() { return config.rows.filter(r => r.name.trim()); }
  function bSet() { return new Set(namedRows().slice(-2).map(r => r.id)); }

  function render() {
    const nDays = daysIn(viewKey);
    const isCur = viewKey === curKey;
    const today = now.getDate();
    const cells = (months[viewKey] && months[viewKey].cells) || {};
    const b = bSet();
    $("monthName").textContent = label(viewKey);

    let h = '<thead><tr><th class="corner sticky">Voce</th>';
    for (let d = 1; d <= 31; d++) h += `<th class="day${isCur && d === today ? " is-today" : ""}">${d}</th>`;
    h += "</tr></thead><tbody>";
    config.rows.forEach((r, i) => {
      h += `<tr data-row="${r.id}"${b.has(r.id) ? ' class="b"' : ""}><th class="name sticky"><div class="name-in" contenteditable="true" spellcheck="false" data-ph="Nome ${i + 1}" id="n-${r.id}"></div></th>`;
      for (let d = 1; d <= 31; d++) {
        const off = d > nDays;
        const v = cells[r.id] && cells[r.id][d];
        h += `<td class="cell${off ? " off" : ""}${isCur && d === today ? " is-today" : ""}"><input id="c-${r.id}-${d}" data-d="${d}" inputmode="decimal" autocomplete="off" aria-label="${r.name || "Voce " + (i + 1)}, giorno ${d}" value="${off ? "" : fmt(v)}"${off ? " disabled" : ""}></td>`;
      }
      h += "</tr>";
    });
    $("grid").innerHTML = h + "</tbody>";
    config.rows.forEach(r => { $("n-" + r.id).textContent = r.name; });
  }

  // Refresh values from new data without rebuilding the field being typed in.
  function refresh() {
    const sameShape = [...document.querySelectorAll("#grid tbody tr")].map(t => t.dataset.row).join() === config.rows.map(r => r.id).join();
    const focus = document.activeElement;
    if (!sameShape || !$("grid").contains(focus)) { render(); return; }
    const cells = (months[viewKey] && months[viewKey].cells) || {};
    const b = bSet();
    config.rows.forEach(r => {
      const n = $("n-" + r.id);
      if (n !== focus && n.textContent !== r.name) n.textContent = r.name;
      n.closest("tr").classList.toggle("b", b.has(r.id));
      for (let d = 1; d <= daysIn(viewKey); d++) {
        const inp = $("c-" + r.id + "-" + d);
        if (inp !== focus) inp.value = fmt(cells[r.id] && cells[r.id][d]);
      }
    });
  }

  // ---- editing ----
  $("grid").addEventListener("input", e => {
    const t = e.target;
    const tr = t.closest("tr"); if (!tr) return;
    const rowId = tr.dataset.row;
    if (t.classList.contains("name-in")) {
      const row = config.rows.find(r => r.id === rowId);
      row.name = t.textContent.replace(/\s+/g, " ").trimStart();
      const b = bSet();
      document.querySelectorAll("#grid tbody tr").forEach(x => x.classList.toggle("b", b.has(x.dataset.row)));
      saveConfig();
    } else if (t.tagName === "INPUT") {
      const v = num(t.value);
      if (v === undefined) return;
      const m = months[viewKey] || (months[viewKey] = { cells: {} });
      const row = m.cells[rowId] || (m.cells[rowId] = {});
      if (v === null) delete row[t.dataset.d]; else row[t.dataset.d] = v;
      saveMonth(viewKey);
    }
  });
  $("grid").addEventListener("keydown", e => {
    if (e.target.classList.contains("name-in") && e.key === "Enter") { e.preventDefault(); e.target.blur(); }
  });
  $("grid").addEventListener("focusout", e => {
    const t = e.target;
    if (t.tagName === "INPUT") { const v = num(t.value); t.value = v == null ? "" : fmt(v); }
    if (t.classList.contains("name-in")) { t.textContent = t.textContent.trim(); }
  });
  $("grid").addEventListener("paste", e => {
    if (!e.target.classList.contains("name-in")) return;
    e.preventDefault();
    document.execCommand("insertText", false, (e.clipboardData.getData("text/plain") || "").replace(/\s+/g, " "));
  });

  $("addRow").onclick = () => { config.rows.push({ id: uid(), name: "" }); render(); saveConfig(); $("n-" + config.rows.at(-1).id).focus(); };
  $("delRow").onclick = () => {
    if (config.rows.length <= 1) return;
    const last = config.rows.at(-1);
    const hasData = Object.values(months).some(m => m.cells && m.cells[last.id] && Object.keys(m.cells[last.id]).length);
    if ((last.name.trim() || hasData) && $("delRow").dataset.armed !== "1") {
      $("delRow").dataset.armed = "1";
      $("delRow").textContent = "Tocca di nuovo per togliere “" + (last.name.trim() || "ultima voce") + "”";
      setTimeout(() => { $("delRow").dataset.armed = ""; $("delRow").textContent = "− Togli ultima voce"; }, 3500);
      return;
    }
    $("delRow").dataset.armed = ""; $("delRow").textContent = "− Togli ultima voce";
    config.rows.pop(); render(); saveConfig();
  };

  $("prevM").onclick = () => { viewKey = shift(viewKey, -1); render(); };
  $("nextM").onclick = () => { viewKey = shift(viewKey, 1); render(); };

  // ---- menu ----
  const menu = $("menu");
  function setMenu(open) { menu.hidden = !open; $("dotsBtn").setAttribute("aria-expanded", open); }
  $("dotsBtn").onclick = e => { e.stopPropagation(); setMenu(menu.hidden); };
  document.addEventListener("click", e => { if (!menu.hidden && !menu.contains(e.target)) setMenu(false); });
  $("goToday").onclick = () => { setMenu(false); viewKey = curKey; render(); };
  $("openSettings").onclick = () => { setMenu(false); openPin(); };

  // ---- PIN ----
  let pin = "";
  function drawPin() { [...$("pinDots").children].forEach((s, i) => s.classList.toggle("on", i < pin.length)); }
  function openPin() { pin = ""; $("pinErr").textContent = ""; drawPin(); $("pinScrim").hidden = false; }
  function closePin() { $("pinScrim").hidden = true; }
  function pressKey(k) {
    if (k === "del") { pin = pin.slice(0, -1); drawPin(); return; }
    if (pin.length >= 4) return;
    pin += k; drawPin(); $("pinErr").textContent = "";
    if (pin.length === 4) {
      if (pin === PIN) { setTimeout(() => { closePin(); openSettings(); }, 120); }
      else {
        const p = $("pinScrim").querySelector(".panel");
        p.classList.remove("shake"); void p.offsetWidth; p.classList.add("shake");
        $("pinErr").textContent = "PIN errato, riprova.";
        setTimeout(() => { pin = ""; drawPin(); }, 350);
      }
    }
  }
  $("keypad").addEventListener("click", e => {
    const btn = e.target.closest("button"); if (!btn || btn.classList.contains("blank")) return;
    pressKey(btn.dataset.k || btn.textContent);
  });
  document.addEventListener("keydown", e => {
    if ($("pinScrim").hidden) return;
    if (/^\d$/.test(e.key)) pressKey(e.key);
    else if (e.key === "Backspace") pressKey("del");
    else if (e.key === "Escape") closePin();
  });
  $("pinCancel").onclick = closePin;

  // ---- settings & generation ----
  function fillSelects() {
    $("startMonth").innerHTML = MESI.map((n, i) => `<option value="${i}">${n}</option>`).join("");
    let ys = "";
    for (let y = now.getFullYear() - 3; y <= now.getFullYear(); y++) ys += `<option value="${y}">${y}</option>`;
    $("startYear").innerHTML = ys;
  }
  function openSettings() {
    const { y, m } = parseKey(config.startMonth);
    if (![...$("startYear").options].some(o => +o.value === y)) $("startYear").insertAdjacentHTML("afterbegin", `<option value="${y}">${y}</option>`);
    $("startMonth").value = m; $("startYear").value = y;
    $("aMin").value = fmt(config.ranges.a[0]); $("aMax").value = fmt(config.ranges.a[1]);
    $("bMin").value = fmt(config.ranges.b[0]); $("bMax").value = fmt(config.ranges.b[1]);
    $("overwrite").checked = !!config.overwrite;
    summarize();
    $("setScrim").hidden = false;
  }
  function readSettings() {
    config.startMonth = mk(+$("startYear").value, +$("startMonth").value);
    const r = ["aMin", "aMax", "bMin", "bMax"].map(id => num($(id).value));
    if (r.every(v => typeof v === "number")) {
      config.ranges = { a: [Math.min(r[0], r[1]), Math.max(r[0], r[1])], b: [Math.min(r[2], r[3]), Math.max(r[2], r[3])] };
    }
    config.overwrite = $("overwrite").checked;
  }
  function monthsToFill() {
    let k = config.startMonth > curKey ? curKey : config.startMonth;
    const list = [];
    while (k <= curKey) { list.push(k); k = shift(k, 1); }
    return list;
  }
  function summarize() {
    readSettings();
    const n = namedRows().length;
    const list = monthsToFill();
    const range = list.length > 1 ? `da <b>${label(list[0])}</b> a <b>${now.getDate()} ${label(curKey)}</b>` : `dal 1 al <b>${now.getDate()} ${label(curKey)}</b>`;
    const r = config.ranges;
    $("summary").innerHTML = n
      ? `Riempirà ${range} per <b>${n} ${n === 1 ? "voce" : "voci"}</b>.<br>Valori tra ${fmt(r.a[0])} e ${fmt(r.a[1])}` + (n > 2 ? `, ultime due tra ${fmt(r.b[0])} e ${fmt(r.b[1])}.` : `; con ${n} ${n === 1 ? "voce" : "voci"} tutte usano ${fmt(r.b[0])}–${fmt(r.b[1])}.`)
      : "Scrivi almeno un nome nella colonna <b>Voce</b>: le righe senza nome non vengono riempite.";
    $("goBtn").disabled = !n;
  }
  ["startMonth", "startYear", "aMin", "aMax", "bMin", "bMax", "overwrite"].forEach(id => $(id).addEventListener("input", () => { summarize(); saveConfig(); }));
  $("setClose").onclick = () => { $("setScrim").hidden = true; };

  function rand(lo, hi) { return Math.round((lo + Math.random() * (hi - lo)) * 10) / 10; }
  $("goBtn").onclick = () => {
    readSettings();
    const rows = namedRows();
    if (!rows.length) return;
    const b = bSet();
    let count = 0;
    const list = monthsToFill();
    for (const k of list) {
      const last = k === curKey ? now.getDate() : daysIn(k);
      const m = months[k] = { cells: JSON.parse(JSON.stringify((months[k] && months[k].cells) || {})) };
      for (const r of rows) {
        const row = m.cells[r.id] || (m.cells[r.id] = {});
        const [lo, hi] = b.has(r.id) ? config.ranges.b : config.ranges.a;
        for (let d = 1; d <= last; d++) {
          if (config.overwrite || row[d] == null) { row[d] = rand(lo, hi); count++; }
        }
      }
      writeDoc("mesi/" + k, m);
    }
    writeDoc("registro/config", config);
    $("setScrim").hidden = true;
    viewKey = curKey; render();
    toast(count ? `Fatto: ${count} valori inseriti (${list.length} ${list.length === 1 ? "foglio" : "fogli"}).` : "Nessuna casella vuota da riempire.");
  };

  let toastT;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

  // ---- boot ----
  fillSelects();
  loadLocal();
  render();

  const claudeApi = window.claude;
  const ready = claudeApi && claudeApi.use ? claudeApi.use("db") : Promise.resolve(null);
  ready.then(d => {
    db = d;
    if (!db) { $("status").textContent = "Salvato solo su questo dispositivo."; return; }
    $("status").textContent = "Salvataggio automatico attivo.";
    db.doc("registro/config").onSnapshot(s => {
      if (s.metadata.hasPendingWrites || timers.config) return;
      if (s.exists) { config = Object.assign(defaults(), JSON.parse(JSON.stringify(s.data()))); saveLocal(); refresh(); }
    }, () => {});
    db.collection("mesi").onSnapshot(s => {
      if (s.metadata.hasPendingWrites) return;
      const next = {};
      s.docs.forEach(doc => { next[doc.id] = JSON.parse(JSON.stringify(doc.data())); });
      // keep months typed here that are still waiting to be saved
      Object.keys(months).forEach(k => { if (timers["m" + k]) next[k] = months[k]; });
      months = next; saveLocal(); refresh();
    }, () => {});
  }).catch(() => { $("status").textContent = "Salvato solo su questo dispositivo."; });
})();
</script>
